name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Pinned, and `.python-version` pins it for local work too. Without
          # this, `requires-python = ">=3.11"` let CI resolve a newer
          # interpreter than developers run: mypy is configured for 3.11, so it
          # parsed the newer venv's numpy stubs — which use PEP 695 `type`
          # statements — under 3.11 rules and failed on a syntax error in a
          # file nobody here wrote. Every step after Type-check was skipped.
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: The interpreter is the one this project targets
        run: |
          # Asserted rather than assumed. A silent interpreter bump is what
          # made CI fail on every commit from M0 onwards while every local
          # run was clean.
          uv run python -c "
          import sys
          assert sys.version_info[:2] == (3, 11), f'expected 3.11, got {sys.version.split()[0]}'
          print(f'python {sys.version.split()[0]}')
          "

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      # CI runs as a non-root user, so the permission-dependent safety checks
      # that a root development container has to skip actually execute here:
      # the unreadable-kill-switch path and the writable-limits-file report.
      - name: Test
        run: uv run pytest -v

      - name: Control plane smoke test
        env:
          TB_VAR_DIR: var
          T212_DEMO_API_KEY: ci-placeholder-key-not-real
        run: |
          uv run tb init
          uv run tb doctor
          uv run tb status
          uv run tb ledger anchor --path var/chain-heads.jsonl
          uv run tb ledger verify
          uv run tb halt -r "CI drill"
          uv run tb status
          uv run tb resume -r "CI drill complete"
          uv run tb ledger verify

      - name: Broker adapter smoke test (no network)
        env:
          TB_VAR_DIR: var
        run: |
          # These read the local endpoint table and archive; none of them
          # reaches the network.
          uv run tb broker limits
          uv run tb broker drift

      - name: Data layer smoke test (no network)
        env:
          TB_VAR_DIR: var
        run: |
          # Every command here reads the local store; none reaches the network.
          uv run tb data audit
          uv run tb data verify
          uv run tb data vintages
          uv run tb data coverage
          # An empty store must refuse to seal rather than produce a vintage
          # over no data — that would be admissible-looking evidence for a
          # backtest that examined nothing.
          if uv run tb data seal; then
            echo "::error::tb data seal produced a vintage from an empty store"
            exit 1
          fi
          echo "seal correctly refused an empty store"

      - name: The backtester cannot manufacture an edge
        env:
          # Its own store. The vintage-tamper drill below destroys `var/bars`
          # on purpose, and a gate that shares a directory with a destructive
          # test is a gate that fails for reasons unrelated to what it checks.
          TB_VAR_DIR: var-calibration
        run: |
          # A release gate, not a diagnostic. Strategies with no edge by
          # construction, run over a random walk: if any of them earns one, the
          # engine is handing out information and every result it has ever
          # produced is suspect. `tb backtest calibrate` exits non-zero on
          # failure, so this step is the gate.
          uv run tb backtest costs
          uv run tb init
          python - <<'PY'
          import random
          from datetime import UTC, datetime, timedelta
          from decimal import Decimal
          from pathlib import Path

          from tb.data.barstore import BarStore
          from tb.data.provider import Bar, BarBatch, Provenance, Resolution, Session
          from tb.ledger.store import Ledger

          BASE = datetime(2024, 1, 2, tzinfo=UTC)
          # One US and one UK issuer, so the run exercises both the FX path and
          # the stamp-duty path rather than only the cheaper of the two.
          UIDS = ["isin:US0378331005", "isin:GB00B03MLX29"]

          with Ledger(Path("var-calibration/ledger.db")) as ledger:
              store = BarStore(ledger, root=Path("var-calibration/bars"))
              for index, uid in enumerate(UIDS):
                  walk = random.Random(500 + index)
                  price = Decimal("100.00")
                  bars = []
                  for day in range(400):
                      opened = BASE + timedelta(days=day)
                      price = max(
                          price + Decimal(str(round(walk.gauss(0, 1.1), 4))), Decimal("1.00")
                      )
                      close = max(
                          price + Decimal(str(round(walk.gauss(0, 0.7), 4))), Decimal("1.00")
                      )
                      bars.append(Bar(
                          instrument_uid=uid, resolution=Resolution.DAILY,
                          bar_open_utc=opened,
                          available_at_utc=opened + timedelta(days=1),
                          ingested_at_utc=opened + timedelta(days=1),
                          provider="fixture", provenance=Provenance.BACKFILL,
                          session=Session.REGULAR, open=price,
                          high=max(price, close) + Decimal("0.5"),
                          low=min(price, close) - Decimal("0.5"),
                          close=close, volume=1_000_000,
                      ))
                  store.ingest(BarBatch(
                      bars=tuple(bars), provider="fixture", symbol=uid,
                      resolution=Resolution.DAILY,
                      requested_start=bars[0].bar_open_utc,
                      requested_end=bars[-1].bar_open_utc,
                  ))
              print(f"seeded {len(UIDS)} instruments over 400 sessions")
          PY
          uv run tb backtest calibrate
          uv run tb backtest calibrations
          # The verdict has to be in the chain, or M5's gate cannot cite it.
          uv run tb ledger verify

      # DESTRUCTIVE — keep this step last among those that touch `var/bars`.
      # It overwrites every Parquet file with garbage on purpose, so any step
      # added after it inherits an unreadable store. That is exactly what
      # happened when the calibration gate was first added below it: the run
      # failed with a pyarrow traceback about missing magic bytes, which looked
      # like a backtester bug and was a step-ordering one.
      - name: A sealed vintage refuses to load once its files change
        env:
          TB_VAR_DIR: var
        run: |
          # The immutability guarantee, exercised end to end. Yahoo restates
          # history routinely, so a vintage that loaded with different bytes
          # would make every promotion resting on it unfalsifiable.
          python - <<'PY'
          from datetime import UTC, datetime, timedelta
          from decimal import Decimal
          from pathlib import Path

          from tb.data.barstore import BarStore
          from tb.data.calendar import TradingCalendar
          from tb.data.provider import Bar, BarBatch, Provenance, Resolution, Session
          from tb.data.snapshot import SnapshotStore
          from tb.ledger.store import Ledger

          cal = TradingCalendar()
          uid = "isin:US0378331005"
          days = [s.day for s in cal.sessions_between(
              datetime(2026, 3, 2).date(), datetime(2026, 3, 6).date()
          )]

          with Ledger(Path("var/ledger.db")) as ledger:
              store = BarStore(ledger, root=Path("var/bars"))
              bars = []
              for index, day in enumerate(days):
                  opened = datetime(day.year, day.month, day.day, tzinfo=UTC)
                  price = Decimal("100.00") + Decimal(index)
                  bars.append(Bar(
                      instrument_uid=uid, resolution=Resolution.DAILY,
                      bar_open_utc=opened,
                      available_at_utc=opened + timedelta(days=1),
                      ingested_at_utc=opened + timedelta(days=1),
                      provider="ci", provenance=Provenance.BACKFILL,
                      session=Session.REGULAR, open=price, high=price,
                      low=price, close=price, volume=1_000_000,
                  ))
              store.ingest(BarBatch(
                  bars=tuple(bars), provider="ci", symbol="AAPL",
                  resolution=Resolution.DAILY,
                  requested_start=bars[0].bar_open_utc,
                  requested_end=bars[-1].bar_open_utc,
              ))
              vintage = SnapshotStore(ledger, store, calendar=cal).seal(
                  resolutions=[Resolution.DAILY]
              )
              Path("var/vintage_id").write_text(vintage.vintage_id)
              print(f"sealed {vintage.vintage_id}")
          PY
          VINTAGE=$(cat var/vintage_id)
          uv run tb data verify "$VINTAGE"
          # Now alter the bytes the vintage names and require a refusal.
          find var/bars -name '*.parquet' -exec sh -c 'printf tampered > "$1"' _ {} \;
          if uv run tb data verify "$VINTAGE"; then
            echo "::error::a vintage loaded after its files changed — immutability is not enforced"
            exit 1
          fi
          echo "vintage correctly refused altered files"

      - name: Probe refuses to characterise a real-money account
        env:
          TB_VAR_DIR: var
          T212_LIVE_API_KEY: ci-placeholder-live-key
        run: |
          # There is no reason to characterise an API using real money, so the
          # refusal is structural. If this ever succeeds, that guard is gone.
          if uv run tb broker probe; then
            echo "::error::tb broker probe ran against a live key — the demo-only guard is broken"
            exit 1
          fi
          echo "probe correctly refused a live key"

      - name: Verify the ledger survives a tamper attempt
        env:
          TB_VAR_DIR: var
        run: |
          # Prove the alarm fires, not just that the lock holds. Drop the
          # append-only triggers the way a real adversary with file access
          # would, edit a row, and require `tb ledger verify` to exit non-zero.
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("var/ledger.db")
          for trigger in ("event_log_no_update", "event_log_no_delete"):
              conn.execute(f"DROP TRIGGER IF EXISTS {trigger}")
          conn.execute("UPDATE event_log SET actor = 'human' WHERE seq = 2")
          conn.commit()
          conn.close()
          PY
          if uv run tb ledger verify; then
            echo "::error::tampering went undetected — the audit ledger is not trustworthy"
            exit 1
          fi
          echo "tamper detected as expected"

      # --- M4: the live path -------------------------------------------------

      - name: The risk engine cannot be bypassed
        env:
          TB_VAR_DIR: var-m4
        run: |
          # The AST scan over the whole tree, run as its own gate rather than
          # only inside the suite. "Every order passes the risk engine" is the
          # property the whole milestone rests on, and a bypass merging is a
          # different kind of failure from a test regressing — so it gets a
          # named step that says what broke.
          set -o pipefail
          uv run pytest tests/test_risk_token.py -q

      - name: Exactly one POST per intent, across every crash point
        env:
          TB_VAR_DIR: var-m4
        run: |
          # Trading 212 has no idempotency key, so exactly-once is synthesised
          # by ordering. The drills inject a crash at each of the five points
          # and assert the POST count and the ledger's conclusion — including
          # the case where the correct conclusion is "unknown, halt".
          set -o pipefail
          uv run pytest tests/test_crash_drills.py tests/test_intents.py -q

      - name: The loop refuses to trade an unverified universe
        env:
          TB_VAR_DIR: var-m4
        run: |
          # A fresh install has no cross-verified mapping, so there is nothing
          # tradable and `tb run` must refuse rather than start degraded. Exit
          # 2 with the remedy named.
          uv run tb init
          if uv run tb run --mode paper --cycles 1; then
            echo "::error::tb run started with nothing verified to trade"
            exit 1
          fi
          uv run tb run --mode paper --cycles 1 2>&1 | grep -q "tb symbols verify" \
            || { echo "::error::the refusal did not name the remedy"; exit 1; }
          echo "refused as expected, naming tb symbols verify"

      - name: The watchdog engages the kill switch on a missing heartbeat
        env:
          TB_VAR_DIR: var-watchdog
        run: |
          # Both halves: the watchdog trips (exit 1) and the kill switch is
          # actually engaged afterwards. Asserting only the exit code would
          # pass for a watchdog that reported a problem and did nothing about
          # it, which is the failure that matters.
          uv run tb init
          if uv run tb watchdog --cycles 1; then
            echo "::error::the watchdog reported healthy with no heartbeat at all"
            exit 1
          fi
          uv run tb status 2>&1 | grep -q "kill switch is engaged" \
            || { echo "::error::the watchdog tripped but did not engage the kill switch"; exit 1; }
          echo "watchdog tripped and engaged the kill switch"

      - name: A live key cannot reach the trading loop
        env:
          TB_VAR_DIR: var-m4
          T212_LIVE_API_KEY: "not-a-real-key-and-must-never-be-used"
        run: |
          # `tb run --mode demo` passes require_demo=True, so a live key is
          # refused before any network call. There is deliberately no live
          # mode in this CLI at all — arming a real-money account is a
          # reviewed change, not a flag.
          if uv run tb run --mode live --cycles 1; then
            echo "::error::tb run accepted a live mode that should not exist"
            exit 1
          fi
          # Asserts the *credential* refusal specifically, not merely that
          # nothing traded. An earlier version of this step grepped for the
          # absence of "placed" and passed because `tb run` exited at the
          # universe check before ever building a broker — a step that was
          # green for a reason unrelated to what it claimed. The broker is now
          # built first, so this reaches the refusal.
          if uv run tb run --mode demo --cycles 1 2>&1 | grep -q "refuses to run against a real-money account"; then
            echo "live key refused at the credential check, as intended"
          else
            echo "::error::tb run did not refuse a live key at the credential check"
            uv run tb run --mode demo --cycles 1 2>&1 | tail -5
            exit 1
          fi
