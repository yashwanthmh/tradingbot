name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Pinned, and `.python-version` pins it for local work too. Without
          # this, `requires-python = ">=3.11"` let CI resolve a newer
          # interpreter than developers run: mypy is configured for 3.11, so it
          # parsed the newer venv's numpy stubs — which use PEP 695 `type`
          # statements — under 3.11 rules and failed on a syntax error in a
          # file nobody here wrote. Every step after Type-check was skipped.
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: The interpreter is the one this project targets
        run: |
          # Asserted rather than assumed. A silent interpreter bump is what
          # made CI fail on every commit from M0 onwards while every local
          # run was clean.
          uv run python -c "
          import sys
          assert sys.version_info[:2] == (3, 11), f'expected 3.11, got {sys.version.split()[0]}'
          print(f'python {sys.version.split()[0]}')
          "

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      # CI runs as a non-root user, so the permission-dependent safety checks
      # that a root development container has to skip actually execute here:
      # the unreadable-kill-switch path and the writable-limits-file report.
      - name: Test
        # The release gate is deselected here and run as its own named step
        # below. Not to save the 90 seconds — so that when it fails the job list
        # says "1,000 random specs promote at or below the ceiling" rather than
        # "Test", which is the whole reason a release gate gets a name.
        run: uv run pytest -v --deselect tests/test_release_gate.py

      - name: Control plane smoke test
        env:
          TB_VAR_DIR: var
          T212_DEMO_API_KEY: ci-placeholder-key-not-real
        run: |
          uv run tb init
          uv run tb doctor
          uv run tb status
          uv run tb ledger anchor --path var/chain-heads.jsonl
          uv run tb ledger verify
          uv run tb halt -r "CI drill"
          uv run tb status
          uv run tb resume -r "CI drill complete"
          uv run tb ledger verify

      - name: Broker adapter smoke test (no network)
        env:
          TB_VAR_DIR: var
        run: |
          # These read the local endpoint table and archive; none of them
          # reaches the network.
          uv run tb broker limits
          uv run tb broker drift

      - name: Data layer smoke test (no network)
        env:
          TB_VAR_DIR: var
        run: |
          # Every command here reads the local store; none reaches the network.
          uv run tb data audit
          uv run tb data verify
          uv run tb data vintages
          uv run tb data coverage
          # An empty store must refuse to seal rather than produce a vintage
          # over no data — that would be admissible-looking evidence for a
          # backtest that examined nothing.
          if uv run tb data seal; then
            echo "::error::tb data seal produced a vintage from an empty store"
            exit 1
          fi
          echo "seal correctly refused an empty store"

      - name: The backtester cannot manufacture an edge
        env:
          # Its own store. The vintage-tamper drill below destroys `var/bars`
          # on purpose, and a gate that shares a directory with a destructive
          # test is a gate that fails for reasons unrelated to what it checks.
          TB_VAR_DIR: var-calibration
        run: |
          # A release gate, not a diagnostic. Strategies with no edge by
          # construction, run over a random walk: if any of them earns one, the
          # engine is handing out information and every result it has ever
          # produced is suspect. `tb backtest calibrate` exits non-zero on
          # failure, so this step is the gate.
          uv run tb backtest costs
          uv run tb init
          python - <<'PY'
          import random
          from datetime import UTC, datetime, timedelta
          from decimal import Decimal
          from pathlib import Path

          from tb.data.barstore import BarStore
          from tb.data.provider import Bar, BarBatch, Provenance, Resolution, Session
          from tb.ledger.store import Ledger

          BASE = datetime(2024, 1, 2, tzinfo=UTC)
          # One US and one UK issuer, so the run exercises both the FX path and
          # the stamp-duty path rather than only the cheaper of the two.
          UIDS = ["isin:US0378331005", "isin:GB00B03MLX29"]

          with Ledger(Path("var-calibration/ledger.db")) as ledger:
              store = BarStore(ledger, root=Path("var-calibration/bars"))
              for index, uid in enumerate(UIDS):
                  walk = random.Random(500 + index)
                  price = Decimal("100.00")
                  bars = []
                  for day in range(400):
                      opened = BASE + timedelta(days=day)
                      price = max(
                          price + Decimal(str(round(walk.gauss(0, 1.1), 4))), Decimal("1.00")
                      )
                      close = max(
                          price + Decimal(str(round(walk.gauss(0, 0.7), 4))), Decimal("1.00")
                      )
                      bars.append(Bar(
                          instrument_uid=uid, resolution=Resolution.DAILY,
                          bar_open_utc=opened,
                          available_at_utc=opened + timedelta(days=1),
                          ingested_at_utc=opened + timedelta(days=1),
                          provider="fixture", provenance=Provenance.BACKFILL,
                          session=Session.REGULAR, open=price,
                          high=max(price, close) + Decimal("0.5"),
                          low=min(price, close) - Decimal("0.5"),
                          close=close, volume=1_000_000,
                      ))
                  store.ingest(BarBatch(
                      bars=tuple(bars), provider="fixture", symbol=uid,
                      resolution=Resolution.DAILY,
                      requested_start=bars[0].bar_open_utc,
                      requested_end=bars[-1].bar_open_utc,
                  ))
              print(f"seeded {len(UIDS)} instruments over 400 sessions")
          PY
          uv run tb backtest calibrate
          uv run tb backtest calibrations
          # The verdict has to be in the chain, or M5's gate cannot cite it.
          uv run tb ledger verify

      # DESTRUCTIVE — keep this step last among those that touch `var/bars`.
      # It overwrites every Parquet file with garbage on purpose, so any step
      # added after it inherits an unreadable store. That is exactly what
      # happened when the calibration gate was first added below it: the run
      # failed with a pyarrow traceback about missing magic bytes, which looked
      # like a backtester bug and was a step-ordering one.
      - name: A sealed vintage refuses to load once its files change
        env:
          TB_VAR_DIR: var
        run: |
          # The immutability guarantee, exercised end to end. Yahoo restates
          # history routinely, so a vintage that loaded with different bytes
          # would make every promotion resting on it unfalsifiable.
          python - <<'PY'
          from datetime import UTC, datetime, timedelta
          from decimal import Decimal
          from pathlib import Path

          from tb.data.barstore import BarStore
          from tb.data.calendar import TradingCalendar
          from tb.data.provider import Bar, BarBatch, Provenance, Resolution, Session
          from tb.data.snapshot import SnapshotStore
          from tb.ledger.store import Ledger

          cal = TradingCalendar()
          uid = "isin:US0378331005"
          days = [s.day for s in cal.sessions_between(
              datetime(2026, 3, 2).date(), datetime(2026, 3, 6).date()
          )]

          with Ledger(Path("var/ledger.db")) as ledger:
              store = BarStore(ledger, root=Path("var/bars"))
              bars = []
              for index, day in enumerate(days):
                  opened = datetime(day.year, day.month, day.day, tzinfo=UTC)
                  price = Decimal("100.00") + Decimal(index)
                  bars.append(Bar(
                      instrument_uid=uid, resolution=Resolution.DAILY,
                      bar_open_utc=opened,
                      available_at_utc=opened + timedelta(days=1),
                      ingested_at_utc=opened + timedelta(days=1),
                      provider="ci", provenance=Provenance.BACKFILL,
                      session=Session.REGULAR, open=price, high=price,
                      low=price, close=price, volume=1_000_000,
                  ))
              store.ingest(BarBatch(
                  bars=tuple(bars), provider="ci", symbol="AAPL",
                  resolution=Resolution.DAILY,
                  requested_start=bars[0].bar_open_utc,
                  requested_end=bars[-1].bar_open_utc,
              ))
              vintage = SnapshotStore(ledger, store, calendar=cal).seal(
                  resolutions=[Resolution.DAILY]
              )
              Path("var/vintage_id").write_text(vintage.vintage_id)
              print(f"sealed {vintage.vintage_id}")
          PY
          VINTAGE=$(cat var/vintage_id)
          uv run tb data verify "$VINTAGE"
          # Now alter the bytes the vintage names and require a refusal.
          find var/bars -name '*.parquet' -exec sh -c 'printf tampered > "$1"' _ {} \;
          if uv run tb data verify "$VINTAGE"; then
            echo "::error::a vintage loaded after its files changed — immutability is not enforced"
            exit 1
          fi
          echo "vintage correctly refused altered files"

      - name: Probe refuses to characterise a real-money account
        env:
          TB_VAR_DIR: var
          T212_LIVE_API_KEY: ci-placeholder-live-key
        run: |
          # There is no reason to characterise an API using real money, so the
          # refusal is structural. If this ever succeeds, that guard is gone.
          if uv run tb broker probe; then
            echo "::error::tb broker probe ran against a live key — the demo-only guard is broken"
            exit 1
          fi
          echo "probe correctly refused a live key"

      - name: Verify the ledger survives a tamper attempt
        env:
          TB_VAR_DIR: var
        run: |
          # Prove the alarm fires, not just that the lock holds. Drop the
          # append-only triggers the way a real adversary with file access
          # would, edit a row, and require `tb ledger verify` to exit non-zero.
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("var/ledger.db")
          for trigger in ("event_log_no_update", "event_log_no_delete"):
              conn.execute(f"DROP TRIGGER IF EXISTS {trigger}")
          conn.execute("UPDATE event_log SET actor = 'human' WHERE seq = 2")
          conn.commit()
          conn.close()
          PY
          if uv run tb ledger verify; then
            echo "::error::tampering went undetected — the audit ledger is not trustworthy"
            exit 1
          fi
          echo "tamper detected as expected"

      # --- M4: the live path -------------------------------------------------

      - name: The risk engine cannot be bypassed
        env:
          TB_VAR_DIR: var-m4
        run: |
          # The AST scan over the whole tree, run as its own gate rather than
          # only inside the suite. "Every order passes the risk engine" is the
          # property the whole milestone rests on, and a bypass merging is a
          # different kind of failure from a test regressing — so it gets a
          # named step that says what broke.
          set -o pipefail
          uv run pytest tests/test_risk_token.py -q

      - name: Exactly one POST per intent, across every crash point
        env:
          TB_VAR_DIR: var-m4
        run: |
          # Trading 212 has no idempotency key, so exactly-once is synthesised
          # by ordering. The drills inject a crash at each of the five points
          # and assert the POST count and the ledger's conclusion — including
          # the case where the correct conclusion is "unknown, halt".
          set -o pipefail
          uv run pytest tests/test_crash_drills.py tests/test_intents.py -q

      - name: The loop refuses to trade an unverified universe
        env:
          TB_VAR_DIR: var-m4
        run: |
          # A fresh install has no cross-verified mapping, so there is nothing
          # tradable and `tb run` must refuse rather than start degraded. Exit
          # 2 with the remedy named.
          uv run tb init
          if uv run tb run --mode paper --cycles 1; then
            echo "::error::tb run started with nothing verified to trade"
            exit 1
          fi
          uv run tb run --mode paper --cycles 1 2>&1 | grep -q "tb symbols verify" \
            || { echo "::error::the refusal did not name the remedy"; exit 1; }
          echo "refused as expected, naming tb symbols verify"

      - name: The watchdog engages the kill switch on a missing heartbeat
        env:
          TB_VAR_DIR: var-watchdog
        run: |
          # Both halves: the watchdog trips (exit 1) and the kill switch is
          # actually engaged afterwards. Asserting only the exit code would
          # pass for a watchdog that reported a problem and did nothing about
          # it, which is the failure that matters.
          uv run tb init
          if uv run tb watchdog --cycles 1; then
            echo "::error::the watchdog reported healthy with no heartbeat at all"
            exit 1
          fi
          uv run tb status 2>&1 | grep -q "kill switch is engaged" \
            || { echo "::error::the watchdog tripped but did not engage the kill switch"; exit 1; }
          echo "watchdog tripped and engaged the kill switch"

      - name: A live key cannot reach the trading loop
        env:
          TB_VAR_DIR: var-m4
          T212_LIVE_API_KEY: "not-a-real-key-and-must-never-be-used"
        run: |
          # `--mode live` refuses before any client exists: the shipped limits
          # keep `live.enabled: false`, and even with it on the ledger must hold
          # a current arming recorded by `tb arm --live` against evidence.
          # Asserted by message, so the step fails if the refusal ever comes
          # from somewhere other than the limits file.
          if uv run tb run --mode live --cycles 1 2>&1 | grep -q "live trading is disabled"; then
            echo "live mode refused: disabled in the shipped limits"
          else
            echo "::error::tb run --mode live was not refused by the limits file"
            uv run tb run --mode live --cycles 1 2>&1 | tail -5
            exit 1
          fi
          # `tb run --mode demo` passes require_demo=True, so a live key is
          # refused before any network call.
          # Asserts the *credential* refusal specifically, not merely that
          # nothing traded. An earlier version of this step grepped for the
          # absence of "placed" and passed because `tb run` exited at the
          # universe check before ever building a broker — a step that was
          # green for a reason unrelated to what it claimed. The broker is now
          # built first, so this reaches the refusal.
          if uv run tb run --mode demo --cycles 1 2>&1 | grep -q "refuses to run against a real-money account"; then
            echo "live key refused at the credential check, as intended"
          else
            echo "::error::tb run did not refuse a live key at the credential check"
            uv run tb run --mode demo --cycles 1 2>&1 | tail -5
            exit 1
          fi

      - name: 1,000 random specs promote at or below the ceiling
        run: |
          # The release gate. With paper_shadow_sessions at 0, this rate is the
          # number of noise strategies that reach real money — so it is a named
          # CI step rather than only a test in the suite, and the three parts
          # are asserted together: the ceiling, that the population actually
          # reached the statistical checks, and that the refusals were
          # statistical rather than procedural. A ceiling met by a gate that
          # refuses everything is not a gate.
          #
          # Deselected from the Test step above, so this is the only run of it.
          uv run pytest tests/test_release_gate.py -q

      - name: A strategy cannot be promoted without passing the gate
        env:
          TB_VAR_DIR: var-m5
        run: |
          # `PROMOTED` is written in exactly one place. This registers a spec
          # and asserts it is a candidate that may not trade, so a refactor
          # that promoted on registration fails here rather than in production.
          uv run tb init
          cat > /tmp/spec.json <<'JSON'
          {
            "name": "ci-sma-cross",
            "entry": {"kind": "compare", "op": "gt",
                      "left": {"kind": "feature", "name": "sma", "lookback": 20},
                      "right": {"kind": "feature", "name": "sma", "lookback": 100}},
            "exit": {"kind": "compare", "op": "lt",
                     "left": {"kind": "feature", "name": "sma", "lookback": 20},
                     "right": {"kind": "feature", "name": "sma", "lookback": 100}},
            "expected_edge_bps": "300",
            "min_holding_minutes": 1440
          }
          JSON
          # Output goes to a file and the file is grepped, rather than piping
          # into `grep -q`. `grep -q` exits on its first match and SIGPIPEs the
          # producer, so under `set -o pipefail` the step fails with the
          # assertion satisfied — a trap worth avoiding even though this
          # workflow's default shell does not set pipefail. The file also lets
          # the step print what it saw when an assertion does fail.
          uv run tb registry register /tmp/spec.json > /tmp/register.txt 2>&1
          grep -q "status candidate" /tmp/register.txt || {
            echo "::error::registration did not produce a candidate"
            cat /tmp/register.txt
            exit 1
          }
          uv run tb registry list > /tmp/list.txt 2>&1
          STRATEGY=$(grep -o 'stg_[0-9a-f]*' /tmp/list.txt | head -1)
          test -n "$STRATEGY" || {
            echo "::error::no strategy id in tb registry list"
            cat /tmp/list.txt
            exit 1
          }
          # A fresh candidate has no holdout, no calibration and no vintage, so
          # the gate must refuse — and exit 1, because a refusal is a finding.
          if uv run tb promote evaluate "$STRATEGY" --apply > /tmp/promote.txt 2>&1; then
            echo "::error::tb promote evaluate promoted a candidate with no evidence at all"
            cat /tmp/promote.txt
            exit 1
          fi
          # Every gate reported, not only the failures: that distinction is what
          # tells a searcher whether a lineage is worth continuing.
          for GATE in sealed_vintage engine_calibrated sealed_holdout deflated_sharpe \
                      deflated_probability pbo cost_to_edge holding_period lineage_budget; do
            grep -q "$GATE" /tmp/promote.txt || {
              echo "::error::$GATE was not reported by tb promote evaluate"
              cat /tmp/promote.txt
              exit 1
            }
          done
          uv run tb registry list > /tmp/list2.txt 2>&1
          grep -q "candidate" /tmp/list2.txt || {
            echo "::error::a refused candidate did not stay a candidate"
            cat /tmp/list2.txt
            exit 1
          }
          echo "refused as expected, every gate reported, and still a candidate"

      - name: The holdout cannot be evaluated twice
        env:
          TB_VAR_DIR: var-m5
        run: |
          # UNIQUE(strategy_id, version) is the whole mechanism. A holdout that
          # can be re-evaluated is a slower training set, because "failed,
          # tweak, resubmit" fits it one bit per attempt.
          STRATEGY=$(uv run tb registry list 2>&1 | grep -o 'stg_[0-9a-f]*' | head -1)
          uv run python - "$STRATEGY" <<'PY'
          import sys
          from datetime import UTC, datetime
          from tb.config.loader import load_hard_limits
          from tb.ledger.store import Ledger, default_ledger_path
          from tb.registry.lineage import SpecRegistry
          from tb.research.holdout import HoldoutAlreadyEvaluated, HoldoutRegistry

          strategy_id = sys.argv[1]
          pinned = load_hard_limits(None)
          with Ledger(default_ledger_path(), config_hash=pinned.config_hash) as ledger:
              registry = SpecRegistry(
                  ledger, per_lineage_budget_ccy=pinned.limits.loss.per_lineage_budget_ccy
              )
              spec = registry.get(strategy_id)
              assert spec is not None, f"{strategy_id} is not registered"
              holdouts = HoldoutRegistry(ledger)
              kwargs = dict(
                  strategy_id=strategy_id,
                  version=1,
                  lineage_id=spec.lineage_id,
                  spec_hash=spec.spec_hash,
                  vintage_id="vint_ci",
                  sealed_from=datetime(2026, 1, 1, tzinfo=UTC),
                  passed=False,
              )
              holdouts.record(**kwargs)
              try:
                  holdouts.record(**kwargs)
              except HoldoutAlreadyEvaluated:
                  print("the second evaluation was refused, as intended")
              else:
                  raise SystemExit("a version was evaluated against the holdout twice")
          PY

      - name: The false-promotion rate is measurable from the command line
        env:
          TB_VAR_DIR: var-m5-null
        run: |
          # The same measurement the release gate makes, through the same
          # function, as a command — because the thresholds it depends on live
          # in a file a human edits, and after editing one the operator has to
          # be able to ask what it did without reading the test suite.
          uv run tb init
          uv run tb research null-gate --specs 60 --days 400 2>&1 | tee /tmp/nullgate.txt
          grep -q "within the" /tmp/nullgate.txt \
            || { echo "::error::tb research null-gate did not report a rate against the ceiling"; exit 1; }
          grep -q "reached the statistical checks" /tmp/nullgate.txt \
            || { echo "::error::the command did not report how many candidates reached the statistics"; exit 1; }

      - name: A promotion changes what the loop trades
        run: |
          # The M5b property, and it is the one that makes every control in M5
          # true of the account rather than only of the database. Before this
          # wiring the loop held one hardcoded strategy and read neither
          # `strategy_status` nor the ladder nor the allocator, so a promotion
          # changed nothing, a rung changed nothing, and an allocation changed
          # nothing.
          #
          # Asserted as a named step rather than only inside the Test job
          # because it is a claim about the *system*: same bars, same broker,
          # same universe, promoted versus not.
          set -o pipefail
          uv run pytest tests/test_funding.py -q 2>&1 | tail -5

      - name: A run with nothing promoted refuses rather than idling
        env:
          TB_VAR_DIR: var-m5b
        run: |
          # An empty book must not start. A loop that started anyway would
          # write a run record, a heartbeat and a cycle event saying nothing
          # traded — indistinguishable from a working day on which nothing
          # signalled, which is the normal state of a correct system.
          #
          # This install has no verified symbol either, so `tb run` stops at the
          # universe check first. Both refusals are exit 2 and both name their
          # remedy; this step asserts the ordering has not been inverted, since
          # an operator told "nothing is promoted" would go and run the searcher
          # when the actual problem is that nothing is tradable.
          uv run tb init
          if uv run tb run --mode paper --cycles 1 > /tmp/run.txt 2>&1; then
            echo "::error::tb run started with an empty book"
            cat /tmp/run.txt
            exit 1
          fi
          grep -q "tb symbols verify" /tmp/run.txt || {
            echo "::error::the refusal did not name the more urgent remedy first"
            cat /tmp/run.txt
            exit 1
          }
          # And the flag that opts into the hand-written strategy is the only
          # accepted one: every other strategy reaches the loop by being
          # promoted.
          if uv run tb run --mode paper --cycles 1 --strategy definitely-not-a-strategy \
              > /tmp/run2.txt 2>&1; then
            echo "::error::tb run accepted an unknown --strategy"
            cat /tmp/run2.txt
            exit 1
          fi
          grep -q "tb promote evaluate" /tmp/run2.txt || {
            echo "::error::the refusal did not say how a strategy is meant to reach the loop"
            cat /tmp/run2.txt
            exit 1
          }
          echo "refused, remedies named in the right order"

      - name: A dry-run research cycle produces its specs and a rejection report
        env:
          TB_VAR_DIR: var-m6
        run: |
          # The M6 check from the plan, end to end through the command line: a
          # sealed vintage in, N specs and a rejection report out, every trial
          # on the log, nothing registered. One driftless random walk, so there
          # is no edge to find — this is about what a cycle produces and
          # records, not about what it finds.
          uv run tb init
          uv run python - <<'PY'
          import random
          from datetime import UTC, datetime, timedelta
          from decimal import Decimal
          from pathlib import Path

          from tb.data.barstore import BarStore
          from tb.data.provider import Bar, BarBatch, Provenance, Resolution, Session
          from tb.ledger.store import Ledger

          BASE = datetime(2024, 1, 2, tzinfo=UTC)
          UID = "isin:US0378331005"
          with Ledger(Path("var-m6/ledger.db")) as ledger:
              store = BarStore(ledger, root=Path("var-m6/bars"))
              walk = random.Random(77)
              price = Decimal("100.00")
              bars = []
              for day in range(500):
                  opened = BASE + timedelta(days=day)
                  price = max(price + Decimal(str(round(walk.gauss(0, 1.1), 4))), Decimal("1.00"))
                  close = max(price + Decimal(str(round(walk.gauss(0, 0.7), 4))), Decimal("1.00"))
                  bars.append(Bar(
                      instrument_uid=UID, resolution=Resolution.DAILY,
                      bar_open_utc=opened,
                      available_at_utc=opened + timedelta(days=1),
                      ingested_at_utc=opened + timedelta(days=1),
                      provider="fixture", provenance=Provenance.BACKFILL,
                      session=Session.REGULAR, open=price,
                      high=max(price, close) + Decimal("0.5"),
                      low=min(price, close) - Decimal("0.5"),
                      close=close, volume=1_000_000,
                  ))
              store.ingest(BarBatch(
                  bars=tuple(bars), provider="fixture", symbol=UID,
                  resolution=Resolution.DAILY,
                  requested_start=bars[0].bar_open_utc,
                  requested_end=bars[-1].bar_open_utc,
              ))
              store.compact()
              print("seeded one driftless random walk over 500 sessions")
          PY
          uv run tb data seal --resolution daily > /tmp/seal.txt 2>&1
          VINTAGE=$(grep -o 'vint_[0-9A-Za-z_-]*' /tmp/seal.txt | head -1)
          test -n "$VINTAGE" || { echo "::error::tb data seal named no vintage"; cat /tmp/seal.txt; exit 1; }
          echo "$VINTAGE" > var-m6/vintage_id

          uv run tb research cycle "$VINTAGE" --trials 24 --per-generation 12 --seed 7 \
              --out /tmp/candidates.jsonl > /tmp/cycle.txt 2>&1 || {
            echo "::error::tb research cycle failed on a sealed vintage"; cat /tmp/cycle.txt; exit 1; }
          cat /tmp/cycle.txt
          # "none" counts: the report must say what was refused even when
          # nothing was, or its absence reads as a report never produced.
          for EXPECTED in "refused before a backtest" "dry run: nothing registered" \
                          "needs an out-of-sample Sharpe" "24 trial(s) recorded" \
                          "wrote 24 candidate spec(s)"; do
            grep -qF "$EXPECTED" /tmp/cycle.txt || {
              echo "::error::the cycle report did not say: $EXPECTED"; cat /tmp/cycle.txt; exit 1; }
          done
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from tb.ledger.store import Ledger
          from tb.strategy.dsl.schema import StrategySpec

          lines = [json.loads(line) for line in Path("/tmp/candidates.jsonl").read_text().splitlines()]
          with Ledger(Path("var-m6/ledger.db")) as ledger:
              recorded = {row[0] for row in ledger.conn.execute("SELECT spec_hash FROM trials")}
              n_trials = ledger.conn.execute("SELECT COUNT(*) FROM trials").fetchone()[0]
              registered = ledger.conn.execute("SELECT COUNT(*) FROM strategy_specs").fetchone()[0]
              completed = ledger.conn.execute(
                  "SELECT payload_json FROM event_log WHERE event_type = 'search.completed'"
              ).fetchone()
          assert len(lines) == 24, f"{len(lines)} specs written for a 24-trial search"
          assert n_trials == 24, f"{n_trials} trials recorded for a 24-trial search"
          assert registered == 0, f"a dry run registered {registered} strategies"
          assert completed is not None and json.loads(completed[0])["n_proposed"] == 24
          for line in lines:
              assert StrategySpec.parse(line["spec"]).spec_hash == line["spec_hash"], line["spec_hash"]
              assert line["spec_hash"] in recorded, f"{line['spec_hash']} has no trial row"
          print("24 specs produced, each one parseable and on the trial log; nothing registered")
          PY
          uv run tb ledger verify

      - name: A failed model call records nothing, and a live key cannot reach a prompt
        env:
          TB_VAR_DIR: var-m6
        run: |
          # The optional LLM proposer, with no network and no key. Two refusals,
          # both exit 2, both naming their cause — and neither may write to the
          # ledger: a call that failed before anything was evaluated is a search
          # that did not happen, and must leave no trials to deflate against.
          VINTAGE=$(cat var-m6/vintage_id)
          count_events() {
            uv run python -c "
          from pathlib import Path
          from tb.ledger.store import Ledger
          with Ledger(Path('var-m6/ledger.db')) as ledger:
              print(ledger.conn.execute('SELECT COUNT(*) FROM event_log').fetchone()[0])
          "
          }
          BEFORE=$(count_events)
          # The one research component that sends text to a third party runs
          # without the live broker key in its environment, or not at all.
          if T212_LIVE_API_KEY=ci-placeholder-live-key-not-real \
              uv run tb research cycle "$VINTAGE" --proposer llm > /tmp/llm-live.txt 2>&1; then
            echo "::error::a model-backed search ran in a process holding the live broker key"
            cat /tmp/llm-live.txt; exit 1
          fi
          grep -q "T212_LIVE_API_KEY" /tmp/llm-live.txt || {
            echo "::error::the refusal did not name the live key"; cat /tmp/llm-live.txt; exit 1; }
          if env -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN \
              uv run tb research cycle "$VINTAGE" --proposer llm > /tmp/llm-nokey.txt 2>&1; then
            echo "::error::a model-backed search reported success with no credential"
            cat /tmp/llm-nokey.txt; exit 1
          fi
          grep -q "ANTHROPIC_API_KEY" /tmp/llm-nokey.txt || {
            echo "::error::the refusal did not name the missing credential"; cat /tmp/llm-nokey.txt; exit 1; }
          AFTER=$(count_events)
          test "$BEFORE" = "$AFTER" || {
            echo "::error::a failed model call wrote $((AFTER - BEFORE)) event(s) to the ledger"; exit 1; }
          echo "both refused, both named their cause, and the ledger did not move"

      - name: Generated specs never execute and never hang
        run: |
          # Deep nesting, huge exponents, NaN, homoglyphs, `__import__`, Python
          # expressions — through the parser, the interpreter and the mutation
          # operators, under a runtime audit hook that fails on any exec,
          # compile or process spawn. A named step because it is a claim about
          # the system: once specs are generated, the parser faces a generator.
          set -o pipefail
          uv run pytest tests/test_dsl_fuzz.py -q 2>&1 | tail -5

      - name: A model is told nothing it could date, and what it returns is data
        run: |
          # Price-blind going out — the prompt builders take only abstract types,
          # a tripwire refuses a rendered date, price, instrument or credential,
          # and two vintages decades apart produce byte-identical prompts. And
          # untrusted coming back: hostile replies are parsed as JSON, validated
          # by the schema, and never executed or obeyed.
          set -o pipefail
          uv run pytest tests/test_llm_proposer.py -q 2>&1 | tail -5

      - name: Shuffled labels show no skill
        run: |
          # M7's verification, as a release gate. Synthetic bars with a
          # learnable rhythm go through the reader, the one pipeline, the label
          # builder and purged, embargoed walk-forward folds. The same folds on
          # shuffled labels must show no skill — skill there is the evaluation's
          # own, and every out-of-sample number this build reports would be
          # suspect — and the real labels must show it, or the null passed only
          # by being unable to find anything. `tb ml calibrate` exits non-zero
          # on either failure; the trainer runs the same null on every fit.
          uv run tb ml calibrate

      - name: A model is loaded only as its spec pins it, and never past its holdout
        run: |
          # The store refuses an artifact edited, deleted, planted or re-pointed
          # by an edited catalog row; the holdout refuses a model that learned
          # from the window it would be scored on; replay re-scores a fill with
          # the model that made it. Trained end to end through the CLI.
          set -o pipefail
          uv run pytest tests/test_ml_model.py tests/test_cli_ml.py tests/test_replay.py -q 2>&1 | tail -5

      # ------------------------------------------------------------------
      # M8: operating it
      # ------------------------------------------------------------------

      - name: An operating day runs end to end from the command line
        run: |
          # The commands an operator runs around a trading day, against a
          # ledger of their own: the alert follower, a halt and a resume, the
          # session record, the journal page written and verified, the live
          # gate naming what is missing, and a backup verified, restored and
          # its receipt brought home. Everything lives under m8/, including
          # its kill switch: the limits are the shipped ones with only the
          # runtime paths moved. Output goes to files before it is searched,
          # so a reader that stops early cannot fail a pipeline for a reason
          # unrelated to the claim.
          set -euo pipefail
          mkdir -p m8
          sed "s#var/run/#m8/var/run/#" config/hard_limits.yaml > m8/limits.yaml
          export TB_VAR_DIR=m8/var
          LIM=(--limits m8/limits.yaml)
          uv run tb init "${LIM[@]}" > /dev/null

          # The follower starts from now; after that, a halt is news once.
          uv run tb alerts "${LIM[@]}" > m8/first.txt
          grep -q "history, not news" m8/first.txt
          uv run tb halt -r "operating-day drill" "${LIM[@]}" > /dev/null
          uv run tb alerts "${LIM[@]}" > m8/alerts.txt
          grep -q "halt raised \[manual\]" m8/alerts.txt
          grep -q "kill switch engaged" m8/alerts.txt
          uv run tb alerts "${LIM[@]}" > m8/again.txt
          grep -q "0 alert(s) delivered" m8/again.txt
          uv run tb resume -r "drill complete" "${LIM[@]}" > /dev/null

          # The session record, and the page written from it and verified.
          uv run tb sessions "${LIM[@]}" > /dev/null
          uv run tb journal write "${LIM[@]}" --dir m8/journal > /dev/null
          uv run tb journal verify --dir m8/journal > /dev/null

          # The live gate names every missing piece and refuses.
          if uv run tb arm "${LIM[@]}" > m8/arm.txt 2>&1; then
            echo "::error::tb arm reported ready on an empty ledger"; cat m8/arm.txt; exit 1
          fi
          for requirement in "live trading enabled in the limits file" \
              "clean demo sessions in a row" "kill-switch drill passed" \
              "watchdog drill passed" "a restore verified on another machine"; do
            grep -q "$requirement" m8/arm.txt \
              || { echo "::error::tb arm did not name: $requirement"; exit 1; }
          done

          # A backup, verified, restored, and its receipt brought home. This is
          # one machine, so the gate must not count it; the restore-elsewhere
          # jobs below do the same across two.
          uv run tb backup create "${LIM[@]}" --to m8/backups > /dev/null
          backup=$(ls -d m8/backups/bkp_*)
          uv run tb backup verify "$backup" > /dev/null
          uv run tb backup restore "$backup" --to m8/restored > /dev/null
          uv run tb backup receipt m8/restored/restore-receipt.json "${LIM[@]}" > /dev/null
          uv run tb backup list > m8/list.txt
          grep -q "same host, so the live gate does not count it" m8/list.txt
          uv run tb ledger verify "${LIM[@]}" > /dev/null
          echo "an operating day ran end to end from the command line"

      - name: The dashboard serves read-only views and a button that only engages
        run: |
          # The real server, not a test client: it must refuse to listen beyond
          # loopback without a token, want the token for every view, refuse a
          # Host it was not started for (DNS rebinding) and a cross-site
          # request, offer no way to release the switch, and engage it — with
          # the halt on the record — when asked properly. The token is made
          # here, never printed, and must appear in nothing the server says.
          set -euo pipefail
          mkdir -p m8d
          sed "s#var/run/#m8d/var/run/#" config/hard_limits.yaml > m8d/limits.yaml
          export TB_VAR_DIR=m8d/var
          LIM=(--limits m8d/limits.yaml)
          uv run tb init "${LIM[@]}" > /dev/null

          if env -u TB_DASHBOARD_TOKEN uv run tb dashboard "${LIM[@]}" --host 0.0.0.0 \
              > m8d/refused.txt 2>&1; then
            echo "::error::tb dashboard listened on every address without a token"; exit 1
          fi
          grep -q "needs TB_DASHBOARD_TOKEN" m8d/refused.txt

          TB_DASHBOARD_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export TB_DASHBOARD_TOKEN
          # Through the environment's own entry point rather than `uv run`, so
          # the PID is the server's and stopping it stops it.
          .venv/bin/tb dashboard "${LIM[@]}" --port 8765 > m8d/server.txt 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/ 2>/dev/null && break
            sleep 0.5
          done
          base=http://127.0.0.1:8765
          auth=(-H "Authorization: Bearer $TB_DASHBOARD_TOKEN")
          expect() {
            local want=$1; shift
            local got; got=$(curl -s -o /dev/null -w "%{http_code}" "$@")
            [ "$got" = "$want" ] || { echo "::error::expected $want, got $got"; exit 1; }
          }
          expect 200 "$base/"
          expect 401 "$base/api/status"
          expect 200 "${auth[@]}" "$base/api/status"
          expect 400 -H "Host: attacker.example" "$base/api/status"
          expect 405 -X DELETE "${auth[@]}" "$base/api/killswitch"
          expect 403 -X POST "${auth[@]}" -H "Origin: http://attacker.example" \
            -H "Content-Type: application/json" -d '{"reason":"forged"}' "$base/api/killswitch"
          curl -fsS "${auth[@]}" "$base/api/status" > m8d/before.json
          grep -q '"kill_switch":{"state":"clear"' m8d/before.json

          curl -fsS "${auth[@]}" -H "Content-Type: application/json" \
            -d '{"reason":"CI drill of the button"}' "$base/api/killswitch" > m8d/engaged.json
          grep -q '"recorded":true' m8d/engaged.json
          test -f m8d/var/run/KILL
          uv run tb status "${LIM[@]}" > m8d/status.txt 2>&1 || true
          grep -q "kill switch is engaged" m8d/status.txt
          curl -fsS "${auth[@]}" "$base/api/status" > m8d/after.json
          grep -q '"state":"halted"' m8d/after.json

          for said in m8d/server.txt m8d/before.json m8d/engaged.json m8d/after.json; do
            if grep -qF "$TB_DASHBOARD_TOKEN" "$said"; then
              echo "::error::the token appeared in $said"; exit 1
            fi
          done
          echo "the dashboard served its views, refused what it should, and its button engaged the switch"

      - name: Real money needs the limits file, the evidence and a person
        run: |
          # Switching `live.enabled` on is the one edit a person makes, and it
          # must not be enough: on a ledger with no evidence, `tb arm --live`
          # refuses even given the confirmation phrase, and `tb run --mode
          # live` refuses for want of an arming before any client exists.
          # The full matrix — every requirement, lapses, the rung cap, the
          # per-cycle permit halting a running loop — is test_arming.py.
          set -euo pipefail
          mkdir -p m8l
          uv run python - config/hard_limits.yaml m8l/limits.yaml <<'PY'
          import sys

          import yaml

          limits = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          limits["live"]["enabled"] = True
          limits["safety"]["kill_switch_path"] = "m8l/var/run/KILL"
          limits["safety"]["heartbeat_path"] = "m8l/var/run/heartbeat"
          open(sys.argv[2], "w", encoding="utf-8").write(yaml.safe_dump(limits, sort_keys=True))
          PY
          export TB_VAR_DIR=m8l/var
          LIM=(--limits m8l/limits.yaml)
          uv run tb init "${LIM[@]}" > /dev/null
          if printf 'arm live\n' | uv run tb arm --live --strategy anything "${LIM[@]}" \
              > m8l/arm.txt 2>&1; then
            echo "::error::tb arm --live armed on an empty ledger"; cat m8l/arm.txt; exit 1
          fi
          grep -q "requirement(s) unmet" m8l/arm.txt
          if T212_LIVE_API_KEY=not-a-real-key uv run tb run --mode live --cycles 1 "${LIM[@]}" \
              > m8l/run.txt 2>&1; then
            echo "::error::tb run --mode live started with no arming"; cat m8l/run.txt; exit 1
          fi
          grep -q "never been armed" m8l/run.txt
          uv run pytest tests/test_arming.py -q -p no:cacheprovider > m8l/pytest.txt 2>&1 \
            || { cat m8l/pytest.txt; exit 1; }
          tail -1 m8l/pytest.txt

      - name: A drill proves a stopped loop leaves its positions protected
        run: |
          # The plan's "kill-switch and watchdog drills during market hours
          # with open positions", against the real loop, the simulated broker
          # and the real watchdog on one pinned clock: the switch halts the loop
          # within a cycle and every stop stays at the broker; a frozen loop is
          # noticed by the watchdog and thawed; a lost stop, a loop that never
          # halts and an absent watchdog each fail the drill. On the demo
          # account it is `tb drill killswitch` and `tb drill watchdog`.
          set -o pipefail
          uv run pytest tests/test_drills.py tests/test_sessions.py -q 2>&1 | tail -3

      - name: A policy trades through the one strategy path, or not at all
        run: |
          # M9 is an interface by decision (docs/decisions/0003-rl-deferred.md).
          # What it fixes: a policy observes only what the snapshot hash covers,
          # answers flat or long, is never asked about a missing feature, is
          # frozen while it trades, and has no path to the funded book — nothing
          # outside tb.strategy.rl imports it. The conformance check passes a
          # well-formed policy and names each rule a broken one breaks, and the
          # decision record's haircut table must stay the gate's own numbers.
          set -o pipefail
          uv run pytest tests/test_rl_policy.py -q 2>&1 | tail -3

  # M8's "restore-from-backup on a clean machine", on two machines. Every job
  # here gets a fresh runner VM, so the backup is made on one, restored on
  # another that has never seen the ledger, and the receipt carried back must
  # be counted by the live gate. A restore on the machine that made the backup
  # proves the files are intact, not that the state survives losing that
  # machine, and the gate does not count one.
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: A backup is made where the ledger lives
        env:
          TB_VAR_DIR: m8/var
        run: |
          set -euo pipefail
          mkdir -p m8
          sed "s#var/run/#m8/var/run/#" config/hard_limits.yaml > m8/limits.yaml
          uv run tb init --limits m8/limits.yaml
          # Something on the record beyond the genesis, so the restored chain
          # has a history to verify.
          uv run tb halt -r "restore drill" --limits m8/limits.yaml
          uv run tb resume -r "restore drill" --limits m8/limits.yaml
          uv run tb backup create --limits m8/limits.yaml --to m8/backups
          uv run tb backup verify m8/backups/bkp_*
          hostname > m8/made-on
          echo "$RUNNER_NAME" > m8/made-by-runner

      - uses: actions/upload-artifact@v4
        with:
          name: m8-origin
          path: m8/
          retention-days: 1
          if-no-files-found: error
          # A re-run of this job must replace its own earlier upload.
          overwrite: true

  restore-elsewhere:
    needs: backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - uses: actions/download-artifact@v4
        with:
          name: m8-origin
          path: m8/

      - name: The backup restores on a machine that has never seen the ledger
        run: |
          set -euo pipefail
          # Another runner: its own VM, holding nothing of the origin's but
          # the backup directory.
          if [ "$RUNNER_NAME" = "$(cat m8/made-by-runner)" ]; then
            echo "::error::this is the runner that made the backup, which proves nothing here"
            exit 1
          fi
          # GitHub's hosted runners all answer to one host name, and the gate
          # tells machines apart by host name, so this one takes a name of its
          # own — as a second machine of the operator's must.
          sudo hostname "restore-$GITHUB_RUN_ID"
          if [ "$(hostname)" = "$(cat m8/made-on)" ]; then
            echo "::error::the restoring machine still shares the maker's host name"
            exit 1
          fi
          # Only the backup directory is read; the origin ledger is not opened.
          uv run tb backup restore m8/backups/bkp_* --to restored
          test -f restored/restore-receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: m8-receipt
          path: restored/restore-receipt.json
          retention-days: 1
          if-no-files-found: error
          # A re-run of this job must replace its own earlier upload.
          overwrite: true

  receipt-home:
    needs: restore-elsewhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - uses: actions/download-artifact@v4
        with:
          name: m8-origin
          path: m8/

      - uses: actions/download-artifact@v4
        with:
          name: m8-receipt
          path: receipt/

      - name: The restore is counted where the live gate reads it
        env:
          TB_VAR_DIR: m8/var
          # Wide enough that no table cell wraps a requirement away from its mark.
          COLUMNS: "300"
        run: |
          set -euo pipefail
          uv run tb backup receipt receipt/restore-receipt.json --limits m8/limits.yaml
          uv run tb backup list > list.txt
          cat list.txt
          grep -q "on another machine" list.txt
          # The gate reads it: of everything `tb arm` asks for, this is the one
          # requirement a CI ledger can meet, and it must show as met.
          uv run tb arm --limits m8/limits.yaml > arm.txt 2>&1 || true
          grep "a restore verified on another machine" arm.txt > restore-row.txt
          cat restore-row.txt
          grep -q "✓" restore-row.txt
