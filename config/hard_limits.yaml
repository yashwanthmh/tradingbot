# ============================================================================
#  HARD LIMITS — the control layer
# ============================================================================
#
#  This file bounds everything the bot is permitted to do. It is loaded once at
#  startup, its hash is pinned into the ledger, and the hash is re-verified on
#  every cycle: a mismatch halts trading.
#
#  Deployment expectation: mounted READ-ONLY, owned by a different OS user than
#  the one running the bot. "The agent cannot modify this" has to be a kernel
#  fact, not a convention — `tb doctor` reports whether that is actually true.
#
#  The bot has full autonomy over WHICH strategies get funded and how much,
#  within these numbers. It has no ability to enlarge its own blast radius:
#  raising any ceiling here is a human action.
#
#  Changing a value takes effect on the next process start, not mid-run.
# ============================================================================

schema_version: 5

# Currency of every *_ccy figure below. Asserted against the base currency the
# broker reports for the account at startup; a mismatch is fatal, because a
# ceiling of 500 means something very different in GBP than in JPY.
currency: GBP

capital:
  # The single most important number here. An absolute cash ceiling on total
  # capital the bot may ever have deployed, independent of what the account
  # actually holds. Percentages scale with the account; this does not.
  absolute_ceiling_ccy: 500.00

  # Percentage caps, applied against account equity, then intersected with the
  # absolute ceiling above. The tighter of the two always wins.
  max_deployed_pct: 10.0
  per_position_pct: 1.0
  max_positions: 10

  # Long-only means every strategy here is a long-equity beta expression, so
  # "ten uncorrelated strategies" is a claim to be measured rather than
  # assumed. Families are discovered from realised position overlap, not
  # declared, and this caps what one family may hold. Tighter than
  # max_deployed_pct deliberately: the failure it prevents is ten strategies
  # finding the same trade and the portfolio quietly being one position.
  max_family_deployed_pct: 4.0

  # Smallest order the bot may place. Newly promoted strategies start here and
  # ratchet up only as realised statistics hold.
  floor_notional_ccy: 15.00

loss:
  # Realised + unrealised loss against the day's opening equity. Stops opening.
  daily_halt_pct: 2.0
  # Rolling 5-trading-day loss. Stops opening.
  rolling_5d_halt_pct: 4.0
  # Drawdown from the all-time equity high-water mark. This one FLATTENS every
  # position and halts, rather than merely declining to open new ones.
  max_drawdown_flatten_pct: 6.0
  # Per-strategy and per-lineage lifetime loss budgets. Exhaustion retires the
  # strategy (or blocks the whole lineage, so a renamed child cannot continue).
  per_strategy_budget_ccy: 50.00
  per_lineage_budget_ccy: 100.00

execution:
  # Cost is the binding constraint on this venue, not alpha. Trading 212 is
  # commission-free but charges 0.15% per FX conversion and UK buys carry 0.5%
  # stamp duty, so a round trip costs ~30-55bps while minute-bar gross edge is
  # 5-20bps. These two rules are what keep the search loop out of that trap.
  min_holding_minutes: 60
  max_cost_to_edge_ratio: 0.33

  # Runaway-loop containment. Most catastrophic bot losses are not bad
  # predictions, they are a loop that placed ten thousand orders.
  max_orders_per_day: 40
  max_orders_per_symbol_per_day: 4

  # Universe size is derived from the rate-limit arithmetic, not taste: a
  # protective stop is a limit-class order at 1 per 2s, so a full portfolio turn
  # across N symbols needs 2N seconds of governor budget just for protection.
  max_universe_symbols: 25

  # Entry always precedes protection (Trading 212 has no bracket/OCO orders), so
  # there is an unavoidable window in which a position has no broker-side stop.
  # Position size is capped such that a gap of this size across that window is
  # survivable inside the daily loss budget.
  unprotected_gap_pct_assumption: 15.0

  # A signal computed on one venue's prices and executed on another's. Beyond
  # this divergence between the data feed and the broker's own quote, the symbol
  # is blocked for new entries.
  max_cross_venue_disagreement_bps: 75.0

  # Never act on a bar older than this. Free feeds are often delayed; acting on
  # a stale bar while believing it is live is how backtests become fiction.
  max_bar_staleness_seconds: 180

  # No entries in the opening or closing auction chaos.
  no_entry_first_minutes: 15
  no_entry_last_minutes: 20

costs:
  # NOT the venue's published fees. The 0.15% FX conversion and the 0.5% UK
  # stamp duty are facts about the world; they live in code beside the
  # arithmetic that charges them, so changing one is a reviewed commit rather
  # than a config edit. What lives here is the judgement call nobody publishes.

  # Half the quoted spread, paid on entry and again on exit. 2bps is realistic
  # for a US megacap in regular hours and optimistic for anything thinner.
  assumed_half_spread_bps: 2.0
  # What a market order pays beyond the spread. Separate from the spread
  # because they scale differently with size and with volatility.
  assumed_slippage_bps: 3.0

  # Backstop against our own arithmetic. If the cost model ever computes a
  # round trip cheaper than this, this is used instead: a cost bug makes
  # trading look free, and that is the expensive direction to be wrong in.
  min_round_trip_cost_bps: 30.0

  # Bounds on what a strategy may CLAIM its edge is. The upper bound is not
  # tuning — it closes a hole. The cost gate divides cost by the strategy's own
  # declared edge, so a spec claiming 10,000bps would pass trivially and the
  # one control keeping the search loop out of the fee trap would be
  # defeatable by the search loop. An edge above this is a malformed spec.
  min_expected_edge_bps: 5.0
  max_expected_edge_bps: 500.0

anomaly:
  # Halt if today's activity exceeds the trailing 95th percentile by this
  # multiple. Cheapest control in the system.
  halt_if_daily_orders_exceed_p95_by: 3.0
  halt_if_daily_notional_exceeds_p95_by: 3.0
  # Absolute backstop for the cold-start case, before any percentile history
  # exists to compare against.
  absolute_max_orders_per_hour: 20

regime:
  # A strategy can be killed; a regime cannot. So this lives in the risk layer,
  # above the allocator: when the reference index is below its long moving
  # average, every strategy's gross exposure is scaled by the factor below.
  reference_symbol: SPY
  exposure_ma_days: 200
  exposure_factor_below_ma: 0.5

promotion:
  # Autonomous promotion: a strategy that clears the gate goes live at floor
  # notional with no human approval. Set paper_shadow_sessions above 0 to
  # reinstate a mandatory demo-trading period before real capital.
  paper_shadow_sessions: 0
  paper_shadow_min_trades: 0

  # Because there is no shadow period, the backtest gate is the only thing
  # between a noise strategy and real money. These thresholds carry that weight.
  #
  # The two deflation numbers are in different units on purpose, and a
  # strategy must clear both. The first is a Sharpe *level* after subtracting
  # the best a search of this size would be expected to produce from noise
  # alone; the second is the *probability* that the true Sharpe beats that
  # same benchmark. The level misses a strategy that clears it on a short
  # sample with fat tails; the probability misses one that is confidently
  # barely-positive. Either alone is a number a long enough search finds by
  # chance.
  min_oos_deflated_sharpe: 0.5
  min_deflated_sharpe_probability: 0.95
  max_oos_drawdown_pct: 15.0
  min_oos_trades: 30
  max_probability_of_backtest_overfitting: 0.25
  # Fraction of a null-strategy population the gate may promote. Asserted by the
  # test suite as a release gate: a 3% false-promotion rate against a searcher
  # proposing a thousand specs a week puts thirty random strategies into
  # production a week.
  max_null_promotion_rate: 0.01

  # Asymmetric size ratchet: up slowly, down fast.
  ratchet_min_days_between_promotions: 5
  ratchet_rungs_lost_on_breach: 2
  ratchet_max_rung: 4

data:
  # Trading 212 serves no market data, so the feed is a separate vendor with
  # separate failure modes. These bound what the bot is allowed to believe.

  # A bar is only actionable within this window of becoming *knowable* —
  # measured against available_at (bar close + provider delay + ingest), never
  # against bar time. A provider whose observed delay exceeds this may supply
  # history but may not drive a live decision.
  max_provider_delay_seconds: 180

  # Which resolutions the bot may trade live. Daily closes are consolidated,
  # revision-stable, and a three-minute staleness bound is irrelevant to a
  # once-a-day decision.
  #
  # **Minute resolution is refused on measured evidence, not on caution.** See
  # docs/decisions/0001-minute-resolution.md for the working. In short, from a
  # real Alpaca IEX pull of 62,549 minute bars over ten of the most liquid US
  # names:
  #
  #   * 3,751 expected minutes had no IEX print at all — about 5.7%, or one
  #     minute in eighteen, on the most liquid names there are;
  #   * the cost gate needs 121bps of declared edge to admit even a US round
  #     trip (40bps cost / 0.33 ratio), against 5-20bps of gross minute-bar
  #     edge. An Irish issuer needs 424bps.
  #
  # Either number alone refuses minute trading. The cross-feed disagreement
  # figure would add precision to a conclusion these two already reach, and it
  # is not obtainable from CI — Yahoo's chart endpoint throttles cloud IPs.
  #
  # What would reopen it: a `free_data_sufficient` verdict from `tb data
  # bakeoff --resolution minute` on a run with two real feeds. Nothing else.
  # `may_widen_live_resolutions` refuses every other verdict, so this edit
  # cannot be made by a measurement that did not happen.
  allowed_live_resolutions: [daily]

  # Promotion gate against feed noise: a strategy's expected edge must exceed
  # the p95 provider disagreement by this multiple. Without it the bot would
  # trade an edge smaller than the error bar on its own prices.
  min_edge_to_feed_noise_ratio: 3.0

  # The regime gate needs history before it means anything. A 200-day moving
  # average wants roughly ten months of sessions; below this the exposure
  # factor stays at its reduced value rather than defaulting to full exposure.
  # "Not enough data" must never read as "no signal, so go ahead."
  min_history_days_for_regime: 250

  # Only *unexplained* gaps count against a feed. A missing minute on a thin
  # name over IEX is normal; a missing minute on a megacap is not.
  max_unexplained_gap_pct: 1.0

  # Prices are stored as integers scaled by 10^this, never as floats: a float
  # round-trip through Parquet changes hashes and quietly breaks reproducibility.
  price_scale: 6

  # Backfill depth. Daily goes back years because the promotion gate needs
  # enough history to be statistically meaningful; minute is shallow because
  # that is all a free feed has.
  backfill_years_daily: 10
  backfill_days_minute: 30

  # Revision detection only covers what gets refetched, so a restatement twenty
  # days back is invisible unless something looks. This fraction of stored
  # history is resampled and re-compared on a schedule.
  revision_canary_sample_pct: 2.0

safety:
  # Where the kill switch and heartbeat live. Presence of the kill file halts
  # trading; so does anything that makes the state undeterminable.
  kill_switch_path: var/run/KILL
  heartbeat_path: var/run/heartbeat
  heartbeat_stale_seconds: 120
  # On boot, if a held position has no live protective stop: flatten it, or
  # attempt to place a stop. Flatten is the default because "place a stop now"
  # after an unknown gap is a decision made with no information.
  on_unprotected_position: flatten   # flatten | protect
  # An intent whose state cannot be resolved against the broker halts the bot
  # and requires human acknowledgement. Guessing about real money is worse.
  halt_on_unreconciled: true

live:
  # Real money. Off. Turning it on is this line, changed by a person in a file
  # the bot cannot write — the reviewed change the ledger pins by hash — and
  # even then `tb arm --live` refuses until the evidence below is recorded.
  enabled: false
  # A session counts as run only if the loop was cycling through it: this share
  # of regular hours within `session_max_cycle_gap_seconds` of a cycle.
  session_min_coverage_pct: 90
  session_max_cycle_gap_seconds: 900
  # A position without a working protective stop for longer than this makes
  # its session unclean. The entry-to-stop window is unavoidable on this venue;
  # an unbounded one is a fault.
  max_unprotected_seconds: 300
  # The evidence `tb arm --live` requires, all of it read from the ledger:
  # consecutive clean sessions on the demo account with at least this many
  # trades closed across them (a loop that never traded has not exercised the
  # order path), a kill-switch drill and a watchdog drill (each during market
  # hours with positions open) within `drills_valid_days`, and a restore from
  # backup verified on another machine within `restore_valid_days`.
  min_clean_demo_sessions: 30
  min_demo_closed_trades: 5
  drills_valid_days: 30
  restore_valid_days: 90
  # An arming lapses after this long, and re-arming re-reads the evidence.
  arming_valid_days: 7
  # Live starts narrow and at floor size: this many strategies, each named at
  # arming, at no size rung above this. Raising either is another reviewed
  # change to this file.
  max_armed_strategies: 1
  max_rung: 0
